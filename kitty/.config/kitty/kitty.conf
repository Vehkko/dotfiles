# =========================
# Kitty config (Alacritty-like)
# File: ~/.config/kitty/kitty.conf
# =========================

# ----- Font -----
font_family      MesloLGS NF
bold_font        MesloLGS NF Bold
italic_font      MesloLGS NF Italic
bold_italic_font MesloLGS NF Bold Italic
font_size        12.0

# 可选：让线框字符更稳（通常不用动）
# box_drawing_scale 0.001, 1, 1.5, 2


# ----- Window -----
# 对应 alacritty: decorations = "None"
hide_window_decorations yes

# 对应 alacritty: opacity = 0.88
# 你原来注释了，这里也注释；想要玻璃就取消注释
# background_opacity 0.88

# 对应 alacritty: [window.padding] x=15 y=15
# kitty 不能直接分别写 x/y，但可以用下面两种写法之一：

# 写法1：最常用：四边统一（接近你的效果）
# window_padding_width 15

# 写法2：精确：左右 15，上下 15（与你完全一致）
window_padding_width 8 15


# ----- Selection / Clipboard -----
# 对应 alacritty: save_to_clipboard = true
# 选中后就复制（如果你习惯“选中即复制”）
copy_on_select yes

# 复制写入系统剪贴板（Wayland / X11 通用）
clipboard_control write-clipboard write-primary


# ----- Colors -----
# 对应 alacritty: draw_bold_text_with_bright_colors = true
bold_text_in_bright_colors yes

# primary（你这里 background/foreground 被注释了；我也保持注释）
# background #0d0d0d
# foreground #cdd6f4

# 如果你希望跟你 Catppuccin-ish 的前景更一致，可以启用：
foreground #cdd6f4
background #0d0d0d

# cursor
# cursor #cdd6f4
cursor #97ff81
# cursor #5dabe9
cursor_text_color #1e1e2e

# selection
selection_background #45475a
# 你 alacritty 用的是 "CellForeground"（表示沿用前景色）
selection_foreground #cdd6f4

# normal (0-7)
# black
color0  #45475a
# red
color1  #f38ba8
# green
color2  #a6e3a1
# yellow
color3  #f9e2af
# blue
color4  #89b4fa
# magenta
color5  #cba6f7
# cyan
color6  #94e2d5
# white
color7  #bac2de

# bright (8-15)
color8  #585b70
color9  #f28fad
color10 #b8f399
color11 #ffe5a0
color12 #9ab7ff
color13 #d0b3ff
color14 #a6f0e4
color15 #eff1f5

cursor_trail 8
cursor_trail_decay 0.15 0.30
cursor_trail_start_threshold 1
cursor_trail_color none

